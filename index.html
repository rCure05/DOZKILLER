<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doz Killer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2 class="logo">DOZ KILLER</h2>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#crew">Crew</a></li>
    </ul>

    <div class="theme-switch">
        <input type="checkbox" id="themeToggle">
        <label for="themeToggle" class="slider"></label>
    </div>
</nav>

<section class="hero" id="home">

    <video autoplay muted loop playsinline class="hero-video">
        <source src="assets/hero-video.mp4" type="video/mp4">
    </video>

    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1></h1>
        <p>Built at Work, Bonded as Family.</p>
    </div>

</section>

<section id="gallery" class="section hidden">
    <h2>Gallery</h2>
    <div class="gallery" id="galleryContainer"></div>
</section>

<section id="crew" class="section hidden">
    <h2>Our Crew</h2>
    <div class="crew-container" id="crewContainer"></div>
</section>

<footer>
    © 2024 DOZKILLER
</footer>

<!-- LIGHTBOX -->
<div id="lightbox">
    <span class="close">&times;</span>
    <img id="lightboxImg">
</div>

<script src="script.js"></script>
</body>
</html>
